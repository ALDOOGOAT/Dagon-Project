<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f172a" />
        <meta name="description" content="Dagon - Aprende y domina SQL" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet" />
        <style>
            html {
                background: #020617;
                color: #f8fafc;
            }

            body {
                background: #020617;
                margin: 0;
            }
        </style>
        <script>
            (function () {
                var palettes = {
                    dagon: {
                        mode: 'dark',
                        primary: '#10b981',
                        secondary: '#06b6d4',
                        accent: '#22d3ee',
                        background: '#020617',
                        surface: '#0f172a',
                        surfaceAlt: '#1e293b',
                        text: '#f8fafc',
                        textMuted: '#94a3b8',
                        border: '#334155'
                    },
                    ocean: {
                        mode: 'dark',
                        primary: '#0ea5e9',
                        secondary: '#06b6d4',
                        accent: '#22d3ee',
                        background: '#0c1929',
                        surface: '#0f2744',
                        surfaceAlt: '#163a6b',
                        text: '#f0f9ff',
                        textMuted: '#7dd3fc',
                        border: '#1e4a6e'
                    },
                    synthwave: {
                        mode: 'dark',
                        primary: '#d946ef',
                        secondary: '#a855f7',
                        accent: '#ec4899',
                        background: '#1a0a2e',
                        surface: '#2d1b4e',
                        surfaceAlt: '#4c1d95',
                        text: '#fdf4ff',
                        textMuted: '#c4b5fd',
                        border: '#5b21b6'
                    },
                    dragon: {
                        mode: 'dark',
                        primary: '#dc2626',
                        secondary: '#991b1b',
                        accent: '#f87171',
                        background: '#1a0505',
                        surface: '#2a0a0a',
                        surfaceAlt: '#450b0b',
                        text: '#fef2f2',
                        textMuted: '#fca5a5',
                        border: '#7f1d1d'
                    },
                    forest: {
                        mode: 'dark',
                        primary: '#22c55e',
                        secondary: '#15803d',
                        accent: '#4ade80',
                        background: '#051a0d',
                        surface: '#0a2a17',
                        surfaceAlt: '#14532d',
                        text: '#f0fdf4',
                        textMuted: '#86efac',
                        border: '#14532d'
                    },
                    midnight: {
                        mode: 'dark',
                        primary: '#6366f1',
                        secondary: '#4338ca',
                        accent: '#818cf8',
                        background: '#0a0a1a',
                        surface: '#121225',
                        surfaceAlt: '#1e1e3f',
                        text: '#eef2ff',
                        textMuted: '#a5b4fc',
                        border: '#312e81'
                    },
                    aurora: {
                        mode: 'light',
                        primary: '#a85f12',
                        secondary: '#d9a441',
                        accent: '#b86f1f',
                        background: '#fffaf2',
                        surface: '#fff7e8',
                        surfaceAlt: '#eed7aa',
                        text: '#2a2118',
                        textMuted: '#6f5842',
                        border: '#d7b983'
                    }
                };

                function decodeUserId(token) {
                    try {
                        var payload = token && token.split('.')[1];
                        if (!payload) return null;
                        var base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
                        var decoded = decodeURIComponent(atob(base64).split('').map(function (char) {
                            return '%' + ('00' + char.charCodeAt(0).toString(16)).slice(-2);
                        }).join(''));
                        return JSON.parse(decoded).sub || null;
                    } catch (error) {
                        return null;
                    }
                }

                function hexToRgb(hex) {
                    return {
                        r: parseInt(hex.slice(1, 3), 16),
                        g: parseInt(hex.slice(3, 5), 16),
                        b: parseInt(hex.slice(5, 7), 16)
                    };
                }

                function rgba(hex, alpha) {
                    var rgb = hexToRgb(hex);
                    return 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', ' + alpha + ')';
                }

                try {
                    var token = localStorage.getItem('token');
                    var userId = decodeUserId(token);
                    var storedPalette = userId ? localStorage.getItem('userPalette:' + userId) : null;
                    var colors = palettes[storedPalette] || palettes.dagon;
                    var root = document.documentElement;
                    var isLight = colors.mode === 'light';
                    var isAurora = storedPalette === 'aurora';

                    root.dataset.themeMode = colors.mode;
                    root.dataset.themePalette = palettes[storedPalette] ? storedPalette : 'dagon';
                    root.classList.add(isLight ? 'theme-light' : 'theme-dark');
                    root.style.setProperty('--color-primary', colors.primary);
                    root.style.setProperty('--color-secondary', colors.secondary);
                    root.style.setProperty('--color-accent', colors.accent);
                    root.style.setProperty('--color-background', colors.background);
                    root.style.setProperty('--color-surface', colors.surface);
                    root.style.setProperty('--color-surface-alt', colors.surfaceAlt);
                    root.style.setProperty('--color-text', colors.text);
                    root.style.setProperty('--color-text-muted', colors.textMuted);
                    root.style.setProperty('--color-border', colors.border);
                    root.style.setProperty('--glass-surface', isLight ? (isAurora ? 'rgba(255, 249, 239, 0.86)' : 'rgba(255, 251, 240, 0.72)') : 'rgba(255, 255, 255, 0.05)');
                    root.style.setProperty('--glass-surface-strong', isLight ? (isAurora ? 'rgba(255, 247, 232, 0.94)' : 'rgba(255, 248, 230, 0.88)') : 'rgba(30, 41, 59, 0.4)');
                    root.style.setProperty('--glass-border', isLight ? (isAurora ? 'rgba(168, 95, 18, 0.22)' : 'rgba(245, 158, 11, 0.18)') : 'rgba(255, 255, 255, 0.18)');
                    root.style.setProperty('--glass-highlight', isLight ? 'rgba(255, 255, 255, 0.82)' : 'rgba(255, 255, 255, 0.15)');
                    root.style.setProperty('--glass-shadow', isLight ? '0 30px 82px -38px rgba(133, 77, 14, 0.28)' : '0 8px 32px 0 rgba(0, 0, 0, 0.37)');
                    root.style.setProperty('--grid-opacity', isLight ? (isAurora ? '0.055' : '0.09') : '0.05');
                    root.style.setProperty('--theme-orb-a', isLight ? rgba(colors.primary, 0.16) : rgba(colors.primary, 0.18));
                    root.style.setProperty('--theme-orb-b', isLight ? rgba(colors.secondary, 0.14) : rgba(colors.secondary, 0.16));
                    root.style.setProperty('--theme-orb-c', isLight ? rgba(colors.accent, 0.12) : rgba(colors.accent, 0.12));

                    var applyBodyBackground = function () {
                        if (!document.body) return;
                        document.body.style.backgroundColor = colors.background;
                        document.body.style.backgroundImage = isLight
                            ? 'radial-gradient(circle at top, rgba(255,255,255,0.98) 0%, rgba(255,249,239,0.96) 34%, rgba(245,228,196,0.88) 74%, rgba(231,204,158,0.72) 100%)'
                            : '';
                    };

                    if (document.body) {
                        applyBodyBackground();
                    } else {
                        document.addEventListener('DOMContentLoaded', applyBodyBackground, { once: true });
                    }

                    var metaTheme = document.querySelector('meta[name="theme-color"]');
                    if (metaTheme) metaTheme.setAttribute('content', colors.background);
                } catch (error) {
                    document.documentElement.classList.add('theme-dark');
                }
            })();
        </script>
        
        <title>Dagon | Plataforma SQL</title>
    </head>
    <body>
        <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
        <div id="root"></div>
    </body>
</html>
