spring.application.name=dagon-backend

# ===============================
# CONFIGURACION DE BASE DE DATOS (Produccion en Railway)
# ===============================
spring.datasource.url=jdbc:postgresql://shinkansen.proxy.rlwy.net:55940/railway
spring.datasource.username=postgres
spring.datasource.password=cbpOPRZfHXLYaWalGVnuHToLmMEqYtRS

# ===============================
# CONFIGURACION DE HIBERNATE/JPA
# ===============================
# Ponemos "none" porque tu base de datos ya fue creada con tu Script Maestro
# y no queremos que Java intente sobrescribir tus tablas.
spring.jpa.hibernate.ddl-auto=none

# Mostramos el SQL en la consola para ver que hace por debajo (muy util para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONFIGURACION DE CONSULTAS SQL (Sandbox)
# ===============================
# Usadas por EjercicioService para ejecutar consultas del usuario
dagon.sandbox.url=jdbc:postgresql://shinkansen.proxy.rlwy.net:55940/railway
dagon.sandbox.username=app_sandbox_user
dagon.sandbox.password=Taxi2097

# ===============================
# SERVICIO MPI (Python mpi4py)
# ===============================
# El controlador AnalyticsController hace POST a esta URL.
dagon.mpi.url=http://127.0.0.1:5001

# ===============================
# CONFIGURACION DE CLAWBOT ( Gemini -> Ollama -> Fallback)
# ===============================
# Gemini API (primera opción - respuestas socráticas)
dagon.gemini.api-key=${GEMINI_API_KEY}

# Ollama (segunda opción - fallback local)
