spring.application.name=dagon-backend
# Railway inyecta PORT; en local queda 8080.
server.port=${PORT:8080}
server.shutdown=graceful
# Fotos de perfil. En Railway: volumen montado y DAGON_UPLOADS_DIR=/data/uploads.
dagon.uploads.dir=${DAGON_UPLOADS_DIR:uploads}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===============================
# CONFIGURACION DE BASE DE DATOS (Produccion en Railway)
# ===============================
# Sin credenciales por defecto: salen de backend/.env (local) o de las variables de Railway.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_PUBLIC_URL:${DATABASE_URL:}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}

# ===============================
# CONFIGURACION DE HIBERNATE/JPA
# ===============================
# Ponemos "none" porque tu base de datos ya fue creada con tu Script Maestro
# y no queremos que Java intente sobrescribir tus tablas.
spring.jpa.hibernate.ddl-auto=none

# Mostramos el SQL en la consola para ver que hace por debajo (muy util para debug)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Pool principal de Hikari. Railway suele cerrar conexiones antiguas; estos
# tiempos evitan retener sockets rotos demasiado tiempo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:120000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:300000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:20000}
spring.datasource.hikari.initialization-fail-timeout=${DB_POOL_INITIALIZATION_FAIL_TIMEOUT_MS:1}

# ===============================
# CONFIGURACION DE CONSULTAS SQL (Sandbox)
# ===============================
# Usadas por EjercicioService para ejecutar consultas del usuario
dagon.sandbox.url=${DAGON_SANDBOX_URL:${SPRING_DATASOURCE_URL:${DATABASE_PUBLIC_URL:${DATABASE_URL:}}}}
dagon.sandbox.username=${DAGON_SANDBOX_USERNAME:app_sandbox_user}
dagon.sandbox.password=${DAGON_SANDBOX_PASSWORD:}
dagon.sandbox.pool.maximum-size=${DAGON_SANDBOX_POOL_MAX_SIZE:4}
dagon.sandbox.pool.initialization-fail-timeout-ms=${DAGON_SANDBOX_POOL_INITIALIZATION_FAIL_TIMEOUT_MS:1}
dagon.sandbox.statement-timeout-ms=${DAGON_SANDBOX_STATEMENT_TIMEOUT_MS:8000}
dagon.sandbox.lock-timeout-ms=${DAGON_SANDBOX_LOCK_TIMEOUT_MS:2000}
dagon.sandbox.idle-transaction-timeout-ms=${DAGON_SANDBOX_IDLE_TX_TIMEOUT_MS:10000}

# Seguridad JWT. DAGON_JWT_SECRET es obligatoria (minimo 32 bytes): sin ella JwtUtil aborta el arranque.
# Sin valor por defecto a proposito: un secreto en el repo permitiria falsificar tokens.
dagon.jwt.secret=${DAGON_JWT_SECRET:}
dagon.jwt.expiration-ms=${DAGON_JWT_EXPIRATION_MS:86400000}
dagon.jwt.issuer=${DAGON_JWT_ISSUER:dagon-backend}
dagon.jwt.audience=${DAGON_JWT_AUDIENCE:dagon-frontend}

# Registro docente: define esta clave en backend/.env o Railway para permitir altas docentes controladas.
dagon.docente.registration-code=${DAGON_DOCENTE_REGISTRATION_CODE:}

# ===============================
# SERVICIO MPI (Python mpi4py)
# ===============================
# El controlador AnalyticsController hace POST a esta URL.
dagon.mpi.url=${DAGON_MPI_URL:http://127.0.0.1:5001}

# ===============================
# CLAWBOT: filtro local -> cache -> Groq -> Gemini -> Ollama -> respuesta local
# ===============================
# Claves en GROQ_API_KEY / GEMINI_API_KEY (variables de Railway, nunca aqui).
dagon.clawbot.providers=${DAGON_CLAWBOT_PROVIDERS:groq,gemini,ollama}
dagon.clawbot.groq.model=${DAGON_CLAWBOT_GROQ_MODEL:openai/gpt-oss-20b}
dagon.clawbot.gemini.model=${DAGON_CLAWBOT_GEMINI_MODEL:gemini-flash-lite-latest}
dagon.clawbot.ollama.enabled=${DAGON_CLAWBOT_OLLAMA_ENABLED:false}

# ===============================
# CONFIGURACION DE SEGURIDAD (CORS)
# ===============================
# Railway: DAGON_CORS_ALLOWED_ORIGINS
dagon.cors.allowed-origins=${DAGON_CORS_ALLOWED_ORIGINS:https://dagon-project.vercel.app,https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000}

# Modelado de enunciados IO: local primero; IA únicamente si faltan patrones.
# Groq openai/gpt-oss-20b verificado por POST real el 2026-10-07; Gemini (gemini-flash-lite-latest) es el respaldo.
# JSON mode se valida de nuevo en el servidor; el proveedor no resuelve ni ejecuta código.
dagon.io.ia.enabled=${DAGON_IO_IA_ENABLED:true}
dagon.io.ia.providers=${DAGON_IO_IA_PROVIDERS:groq,gemini,ollama}
dagon.io.ia.timeout-seconds=${DAGON_IO_IA_TIMEOUT_SECONDS:15}
dagon.io.ia.max-tokens=${DAGON_IO_IA_MAX_TOKENS:2000}
dagon.io.ia.attempts=${DAGON_IO_IA_ATTEMPTS:1}
dagon.io.gemini.model=${DAGON_IO_GEMINI_MODEL:gemini-flash-lite-latest}
dagon.io.groq.model=${DAGON_IO_GROQ_MODEL:openai/gpt-oss-20b}
# Plan gratuito de Groq: 8000 tokens/min por modelo. Ante 429 se prueba el siguiente modelo y luego Gemini.
dagon.io.groq.fallback-models=${DAGON_IO_GROQ_FALLBACK_MODELS:openai/gpt-oss-120b}
dagon.io.ollama.enabled=${DAGON_IO_OLLAMA_ENABLED:false}
dagon.io.ollama.model=${DAGON_IO_OLLAMA_MODEL:qwen2.5:7b}
dagon.io.ollama.url=${DAGON_IO_OLLAMA_URL:http://127.0.0.1:11434/api/chat}

# GPT-OSS en Groq admite decoding estricto del esquema IO cerrado; otros modelos pueden usar JSONmode.
dagon.io.groq.structured=${DAGON_IO_GROQ_STRUCTURED:true}
