1=Teoria de conjuntos aplicada a SELECT: universo, subconjunto, interseccion, union, columnas, FROM y primeras condiciones.
2=CRUD y DML: INSERT, UPDATE, DELETE, WHERE seguro, RETURNING y verificacion de filas afectadas.
3=Relaciones entre entidades: claves primarias, claves foraneas, INNER JOIN, LEFT JOIN y condiciones ON.
4=Reto integrador inicial: MER, diseno, JOIN, filtros, consultas finales y explicacion de decisiones.
5=DDL basico: CREATE TABLE, tipos de dato, PRIMARY KEY, NOT NULL, DEFAULT y reglas estructurales.
6=Constraints de validacion: UNIQUE, CHECK, DEFAULT, NULL, reglas de negocio y pruebas de datos invalidos.
7=Secuencias e IDs: SERIAL, nextval, currval, claves generadas y cuidado al reiniciar secuencias.
8=Filtros precisos: WHERE, BETWEEN, IN, IS NULL, comparaciones y lectura exacta del enunciado.
9=Vistas: CREATE VIEW, tabla base, consulta derivada, reutilizacion y diferencia entre vista y tabla.
10=Catalogos de PostgreSQL: information_schema, tablas, columnas, constraints, esquemas y metadatos.
11=Patrones de busqueda: LIKE, comodines %, prefijos, sufijos, contiene y sensibilidad a mayusculas.
12=Funciones SQL: parametros, retorno, tipos, cuerpo de funcion y separacion entre entrada, proceso y salida.
13=PL/pgSQL procedural: bloques, variables, INSERT controlado, captura de IDs y flujo paso a paso.
14=Triggers: BEFORE, AFTER, NEW, OLD, RETURN NEW, auditoria y eventos sobre tablas.
15=Transacciones: BEGIN, COMMIT, ROLLBACK, SAVEPOINT, atomicidad y recuperacion segura.
16=Bloqueos: FOR UPDATE, NOWAIT, sesiones concurrentes, filas bloqueadas y cierre de transacciones.
17=Algebra relacional: UNION, INTERSECT, EXCEPT, columnas compatibles y manejo de duplicados.
18=Roles y permisos: usuarios, current_user, GRANT, REVOKE, privilegios minimos y seguridad basica.
19=Row Level Security: politicas por usuario, aislamiento de filas, roles, esquemas y contexto seguro.
20=Proyecto final: integrar MER, DDL, DML, vistas, funciones, triggers, transacciones y explicacion tecnica.
default=SQL general: leer el enunciado, separar origen de datos, columnas, filtros, relaciones y validacion.
