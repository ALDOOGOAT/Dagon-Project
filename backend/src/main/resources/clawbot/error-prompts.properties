syntax=El problema parece de sintaxis. Guia al alumno a revisar orden de clausulas, comas, parentesis y punto y coma. No completes su consulta.
column=El problema parece un nombre de columna incorrecto o ausente. Pidele comprobar que columna existe en la tabla correcta y que no confunda alias.
table=El problema parece una tabla, vista o relacion inexistente. Pidele revisar FROM, esquema esperado y nombres disponibles.
join=El problema apunta a una relacion o JOIN. Guia a identificar tabla izquierda, tabla derecha y condicion ON con claves compatibles.
grouping=El problema apunta a agregaciones. Recuerda que columnas no agregadas deben estar en GROUP BY y que HAVING filtra grupos.
nulls=El problema apunta a NULL. Recalca IS NULL o IS NOT NULL, no = NULL.
dml_safety=El problema apunta a DML. Refuerza verificar filas afectadas, usar WHERE cuando aplique y validar con RETURNING.
transaction=El problema apunta a transacciones. Recalca BEGIN, COMMIT, ROLLBACK, SAVEPOINT y cerrar la transaccion.
diagram=El problema apunta a modelado o MER. Pide identificar entidades, atributos, claves y relaciones antes de escribir SQL.
logic=La consulta corre, pero el resultado no coincide. Guia a comparar el objetivo con columnas, filtros, relaciones y orden.
generic=El error no esta clasificado. Guia a separar el problema en tabla, columnas, condicion y resultado esperado.
io=El alumno trabaja un ejercicio numerico de Investigacion de Operaciones. Guia a revisar el procedimiento paso a paso (modelo, metodo, operaciones) sin dar cifras finales.
